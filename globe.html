<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 地球仪</title>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #06070d; }
    #map { width: 100%; height: 100%; }

    /* 图层切换面板 */
    #layer-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #layer-panel button {
      background: rgba(12, 14, 24, 0.88);
      color: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.18s, border-color 0.18s;
      letter-spacing: 0.3px;
      text-align: left;
      min-width: 110px;
    }

    #layer-panel button:hover  { background: rgba(35, 82, 195, 0.52); border-color: rgba(90,150,255,0.5); }
    #layer-panel button.active { background: rgba(30, 76, 200, 0.78); border-color: rgba(90,150,255,0.9); color: #fff; }

    /* Token 未设置时的提示覆盖层 */
    #token-overlay {
      position: fixed;
      inset: 0;
      background: rgba(6, 7, 20, 0.96);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: rgba(255,255,255,0.85);
      text-align: center;
      padding: 32px;
    }

    #token-overlay h2 { font-size: 20px; margin-bottom: 12px; font-weight: 600; }
    #token-overlay p  { font-size: 14px; color: rgba(255,255,255,0.55); line-height: 1.7; max-width: 440px; }
    #token-overlay a  { color: #6aa8ff; }

    #token-input-row {
      display: flex;
      gap: 8px;
      margin-top: 24px;
      width: 100%;
      max-width: 480px;
    }

    #token-input {
      flex: 1;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: #fff;
      padding: 9px 13px;
      font-size: 13px;
      outline: none;
    }

    #token-input:focus { border-color: rgba(90,150,255,0.7); }

    #token-submit {
      background: rgba(30, 76, 200, 0.85);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 18px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    #token-submit:hover { background: rgba(40, 100, 240, 0.95); }

    #hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      letter-spacing: 0.8px;
      pointer-events: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: rgba(0,0,0,0.32);
      padding: 5px 14px;
      border-radius: 20px;
    }

    .mapboxgl-ctrl-logo { display: none !important; }
    .mapboxgl-ctrl-group {
      background: rgba(12,14,24,0.88) !important;
      border: 1px solid rgba(255,255,255,0.12) !important;
    }
    .mapboxgl-ctrl-group button { background-color: transparent !important; }
    .mapboxgl-ctrl-icon { filter: invert(1); }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Token 未填写时显示的输入框 -->
  <div id="token-overlay">
    <h2>🔑 需要 Mapbox Access Token</h2>
    <p>
      前往 <a href="https://www.mapbox.com" target="_blank">mapbox.com</a> 免费注册，<br>
      在 <a href="https://account.mapbox.com" target="_blank">account.mapbox.com</a> 复制 Default public token（<code>pk.</code> 开头），<br>
      粘贴到下方即可使用。每月 5 万次免费，不会自动扣费。
    </p>
    <div id="token-input-row">
      <input id="token-input" type="text" placeholder="pk.eyJ1Ijoixxxxxx..." />
      <button id="token-submit" onclick="applyToken()">启动地球仪</button>
    </div>
  </div>

  <div id="layer-panel" style="display:none">
    <button id="btn-streets"          class="active" onclick="setStyle('streets-v12')"         >🗺 街道地图</button>
    <button id="btn-satellite-streets"               onclick="setStyle('satellite-streets-v12')">🛰 卫星+标注</button>
    <button id="btn-satellite"                       onclick="setStyle('satellite-v9')"         >🌍 纯卫星</button>
    <button id="btn-outdoors"                        onclick="setStyle('outdoors-v12')"         >🏔 地形户外</button>
  </div>

  <div id="hint" style="display:none">拖拽旋转 &nbsp;·&nbsp; 滚轮缩放 &nbsp;·&nbsp; Ctrl+拖拽倾斜视角</div>

  <script>
    // ── 已有 token 直接写在这里（可选） ──────────────────────────────
    const SAVED_TOKEN = '';   // 例：'pk.eyJ1Ijoixxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'
    // ─────────────────────────────────────────────────────────────────

    let map = null;

    // 如果已填写 token，跳过输入框直接启动
    if (SAVED_TOKEN.startsWith('pk.')) {
      document.getElementById('token-overlay').style.display = 'none';
      initMap(SAVED_TOKEN);
    }

    function applyToken() {
      const token = document.getElementById('token-input').value.trim();
      if (!token.startsWith('pk.')) {
        alert('Token 格式不正确，应以 pk. 开头');
        return;
      }
      document.getElementById('token-overlay').style.display = 'none';
      initMap(token);
    }

    // 支持回车提交
    document.getElementById('token-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') applyToken();
    });

    function initMap(token) {
      mapboxgl.accessToken = token;

      map = new mapboxgl.Map({
        container : 'map',
        style     : 'mapbox://styles/mapbox/streets-v12',
        center    : [110, 28],
        zoom      : 2,
        projection: 'globe',
        antialias : true,
      });

      // 大气层 + 星空（地球仪专属效果）
      map.on('style.load', applyFog);

      // 导航控件
      map.addControl(new mapboxgl.NavigationControl({ visualizePitch: true }), 'bottom-right');

      // 显示 UI
      document.getElementById('layer-panel').style.display = 'flex';
      document.getElementById('hint').style.display = 'block';
    }

    function applyFog() {
      map.setFog({
        color           : 'rgb(186, 210, 235)',
        'high-color'    : 'rgb(36, 92, 223)',
        'horizon-blend' : 0.02,
        'space-color'   : 'rgb(6, 7, 20)',
        'star-intensity': 0.65,
      });
    }

    // ── 图层切换 ──
    const STYLE_BTNS = {
      'streets-v12'          : 'btn-streets',
      'satellite-streets-v12': 'btn-satellite-streets',
      'satellite-v9'         : 'btn-satellite',
      'outdoors-v12'         : 'btn-outdoors',
    };

    function setStyle(styleId) {
      if (!map) return;
      map.setStyle('mapbox://styles/mapbox/' + styleId);
      map.once('style.load', applyFog);
      Object.entries(STYLE_BTNS).forEach(([id, btnId]) => {
        document.getElementById(btnId).classList.toggle('active', id === styleId);
      });
    }
  </script>
</body>
</html>
