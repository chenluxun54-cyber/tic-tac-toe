<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 地球仪</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #globe { width: 100%; height: 100%; }

    #hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      letter-spacing: 0.8px;
      pointer-events: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: rgba(0,0,0,0.35);
      padding: 5px 14px;
      border-radius: 20px;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      letter-spacing: 1.5px;
      z-index: 10;
      transition: opacity 0.8s;
    }
    #loading.fade { opacity: 0; pointer-events: none; }

    .spinner {
      width: 36px; height: 36px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: rgba(120,180,255,0.9);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loading"><div class="spinner"></div>加载中…</div>
  <div id="globe"></div>
  <div id="hint">拖拽旋转 &nbsp;·&nbsp; 滚轮缩放</div>

  <!-- Globe.GL -->
  <script src="https://unpkg.com/globe.gl@2.30.0/dist/globe.gl.min.js"></script>
  <!-- TopoJSON 解析库（用于把压缩地图数据转成 GeoJSON） -->
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

  <script>
    // ── ISO 数字代码 → 国家名（中英文主要国家） ──────────────────────────
    const COUNTRY_NAMES = {
      4:'阿富汗',8:'阿尔巴尼亚',12:'阿尔及利亚',24:'安哥拉',32:'阿根廷',
      36:'澳大利亚',40:'奥地利',50:'孟加拉',56:'比利时',64:'不丹',
      68:'玻利维亚',76:'巴西',100:'保加利亚',104:'缅甸',116:'柬埔寨',
      120:'喀麦隆',124:'加拿大',152:'智利',156:'中国',170:'哥伦比亚',
      178:'刚果',188:'哥斯达黎加',191:'克罗地亚',192:'古巴',203:'捷克',
      208:'丹麦',218:'厄瓜多尔',818:'埃及',231:'埃塞俄比亚',246:'芬兰',
      250:'法国',276:'德国',288:'加纳',300:'希腊',320:'危地马拉',
      332:'海地',340:'洪都拉斯',356:'印度',360:'印度尼西亚',364:'伊朗',
      368:'伊拉克',372:'爱尔兰',376:'以色列',380:'意大利',392:'日本',
      400:'约旦',404:'肯尼亚',408:'朝鲜',410:'韩国',414:'科威特',
      418:'老挝',422:'黎巴嫩',434:'利比亚',458:'马来西亚',484:'墨西哥',
      504:'摩洛哥',516:'纳米比亚',524:'尼泊尔',528:'荷兰',554:'新西兰',
      558:'尼加拉瓜',566:'尼日利亚',578:'挪威',586:'巴基斯坦',
      604:'秘鲁',608:'菲律宾',616:'波兰',620:'葡萄牙',634:'卡塔尔',
      642:'罗马尼亚',643:'俄罗斯',682:'沙特阿拉伯',706:'索马里',
      710:'南非',724:'西班牙',752:'瑞典',756:'瑞士',760:'叙利亚',
      764:'泰国',788:'突尼斯',792:'土耳其',800:'乌干达',804:'乌克兰',
      784:'阿联酋',826:'英国',840:'美国',858:'乌拉圭',
      862:'委内瑞拉',704:'越南',887:'也门',716:'津巴布韦',
      262:'吉布提',266:'加蓬',324:'几内亚',480:'毛里求斯',508:'莫桑比克',
      520:'瑙鲁',540:'新喀里多尼亚',598:'巴布亚新几内亚',
    };

    // ── 初始化 Globe.GL ──────────────────────────────────────────────
    const globe = Globe()
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-day.jpg')
      .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
      .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
      .showAtmosphere(true)
      .atmosphereColor('lightskyblue')
      .atmosphereAltitude(0.20)
      // 国家边界线（数据加载后填充）
      .polygonsData([])
      .polygonCapColor(() => 'rgba(0,0,0,0)')          // 填充透明
      .polygonSideColor(() => 'rgba(0,0,0,0)')
      .polygonStrokeColor(() => 'rgba(255,255,255,0.45)')  // 白色边界线
      .polygonAltitude(0.001)
      // 悬停时显示国家名
      .polygonLabel(feat => {
        const id = parseInt(feat.id);
        const name = COUNTRY_NAMES[id] || feat.id;
        return `<div style="
          background:rgba(0,0,0,0.7);
          color:#fff;
          padding:4px 10px;
          border-radius:6px;
          font-family:system-ui,sans-serif;
          font-size:13px;
          letter-spacing:0.5px;
        ">${name}</div>`;
      })
      .onGlobeReady(() => {
        document.getElementById('loading').classList.add('fade');
      })
      (document.getElementById('globe'));

    // 初始视角（亚洲正上方）
    globe.pointOfView({ lat: 28, lng: 110, altitude: 2.5 });

    // 控制器
    const ctrl = globe.controls();
    ctrl.autoRotate      = true;
    ctrl.autoRotateSpeed = 0.35;
    ctrl.enableDamping   = true;
    ctrl.dampingFactor   = 0.08;
    ctrl.minDistance     = 101;
    ctrl.maxDistance     = 700;

    // 用户操作时停止自动旋转
    ctrl.addEventListener('start', () => { ctrl.autoRotate = false; });

    // ── 加载国家边界 GeoJSON（TopoJSON 格式，~500 KB） ──────────────
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json')
      .then(r => r.json())
      .then(world => {
        const geojson = topojson.feature(world, world.objects.countries);
        globe.polygonsData(geojson.features);
      })
      .catch(() => {
        // 静默失败：地球仪本身仍然正常显示，只是没有边界线
      });

    // 窗口大小变化
    window.addEventListener('resize', () => {
      globe.width(window.innerWidth).height(window.innerHeight);
    });
  </script>
</body>
</html>
