<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 地球仪</title>

  <!--
    CESIUM_BASE_URL 必须在加载 Cesium.js 之前设置，否则 Workers 无法找到资源。
    这是之前黑屏的根本原因之一。
  -->
  <script>
    window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/';
  </script>

  <!-- CDN 使用 jsdelivr（cesium.com/downloads 已 404） -->
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Cesium.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #06070d; }
    #cesiumContainer { width: 100%; height: 100%; }

    .cesium-credit-logoContainer { display: none !important; }

    /* ── Token 输入覆盖层 ── */
    #token-overlay {
      position: fixed;
      inset: 0;
      background: rgba(6, 7, 20, 0.97);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: rgba(255,255,255,0.85);
      text-align: center;
      padding: 32px;
      gap: 0;
    }

    #token-overlay h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    #token-overlay .steps {
      font-size: 13.5px;
      color: rgba(255,255,255,0.52);
      line-height: 2;
      margin-bottom: 24px;
    }

    #token-overlay a { color: #6aa8ff; text-decoration: none; }
    #token-overlay a:hover { text-decoration: underline; }

    #token-row {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 12px;
    }

    #token-input {
      flex: 1;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: #fff;
      padding: 10px 14px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    #token-input:focus { border-color: rgba(90,150,255,0.7); }

    #token-submit {
      background: rgba(30, 76, 200, 0.9);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.18s;
    }

    #token-submit:hover { background: rgba(45, 100, 240, 1); }

    #skip-btn {
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      cursor: pointer;
      background: none;
      border: none;
      text-decoration: underline;
      margin-top: 4px;
    }

    #skip-btn:hover { color: rgba(255,255,255,0.6); }

    /* ── 图层切换 ── */
    #layer-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      display: none;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #layer-panel button {
      background: rgba(12, 14, 24, 0.88);
      color: rgba(255,255,255,0.82);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.18s, border-color 0.18s;
      letter-spacing: 0.3px;
      text-align: left;
      min-width: 116px;
    }

    #layer-panel button:hover  { background: rgba(35,82,195,0.52); border-color: rgba(90,150,255,0.5); }
    #layer-panel button.active { background: rgba(30,76,200,0.78);  border-color: rgba(90,150,255,0.9); color:#fff; }

    /* ── 操作提示 ── */
    #hint {
      display: none;
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      letter-spacing: 0.8px;
      pointer-events: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: rgba(0,0,0,0.32);
      padding: 5px 14px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <div id="cesiumContainer"></div>

  <!-- Token 输入面板 -->
  <div id="token-overlay">
    <h2>🌍 Cesium Ion Token</h2>
    <div class="steps">
      1. 打开 <a href="https://ion.cesium.com" target="_blank">ion.cesium.com</a>，用邮箱免费注册（无需信用卡）<br>
      2. 登录后在首页复制 <strong>Default Access Token</strong><br>
      3. 粘贴到下方，享受卫星 + 3D 地形地球仪
    </div>
    <div id="token-row">
      <input id="token-input" type="text" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." />
      <button id="token-submit" onclick="startWithToken()">启动</button>
    </div>
    <button id="skip-btn" onclick="startWithOSM()">不填 token，使用 OpenStreetMap（无卫星图）</button>
  </div>

  <!-- 图层切换（ion token 模式） -->
  <div id="layer-panel">
    <button id="btn-aerial"   class="active" onclick="setLayer('aerial')"  >🛰 卫星图像</button>
    <button id="btn-streets"                 onclick="setLayer('streets')" >🗺 街道地图</button>
    <button id="btn-terrain"                 onclick="setLayer('terrain')" >🏔 卫星+地形</button>
  </div>

  <div id="hint">左键拖拽旋转 &nbsp;·&nbsp; 右键平移 &nbsp;·&nbsp; 中键/滚轮缩放 &nbsp;·&nbsp; 右键拖拽倾斜</div>

  <script>
    // ── 如已有 token，直接填在这里跳过输入框 ──
    const SAVED_TOKEN = '';
    // ─────────────────────────────────────────

    if (SAVED_TOKEN) {
      document.getElementById('token-overlay').style.display = 'none';
      initMap(SAVED_TOKEN, true);
    }

    document.getElementById('token-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') startWithToken();
    });

    function startWithToken() {
      const token = document.getElementById('token-input').value.trim();
      if (!token) { alert('请输入 Token'); return; }
      hideOverlay();
      initMap(token, true);
    }

    function startWithOSM() {
      hideOverlay();
      initMap(null, false);
    }

    function hideOverlay() {
      document.getElementById('token-overlay').style.display = 'none';
      document.getElementById('layer-panel').style.display = 'flex';
      document.getElementById('hint').style.display = 'block';
    }

    // ── 全局 viewer ──
    let viewer = null;

    function initMap(token, useIon) {
      if (token) Cesium.Ion.defaultAccessToken = token;

      const viewerOpts = {
        baseLayerPicker      : false,
        geocoder             : false,
        homeButton           : false,
        sceneModePicker      : false,
        navigationHelpButton : false,
        animation            : false,
        timeline             : false,
        fullscreenButton     : false,
        infoBox              : false,
        selectionIndicator   : false,
      };

      if (!useIon) {
        // 无 token：用 OSM 瓦片，禁用 ion 默认底图
        viewerOpts.baseLayer = false;
        viewerOpts.terrainProvider = new Cesium.EllipsoidTerrainProvider();
      }

      viewer = new Cesium.Viewer('cesiumContainer', viewerOpts);

      if (!useIon) {
        // 手动加载 OSM 底图
        viewer.imageryLayers.addImageryProvider(
          new Cesium.UrlTemplateImageryProvider({
            url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            subdomains: ['a','b','c'],
            tilingScheme: new Cesium.WebMercatorTilingScheme(),
            credit: new Cesium.Credit('© OpenStreetMap contributors', true),
          })
        );
        // ion 模式下隐藏图层面板
        document.getElementById('layer-panel').style.display = 'none';
      }

      // 视觉设置
      viewer.scene.skyAtmosphere.show = true;
      viewer.scene.globe.showGroundAtmosphere = true;
      viewer.scene.fog.enabled = true;
      viewer.scene.globe.enableLighting = true;  // 昼夜光影

      // 初始视角：从太空俯瞰亚洲
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(110.0, 28.0, 20000000),
        orientation: {
          heading: Cesium.Math.toRadians(0),
          pitch  : Cesium.Math.toRadians(-45),
          roll   : 0,
        },
        duration: 2,
      });
    }

    // ── 图层切换（仅 ion 模式） ──
    const LAYERS = {
      aerial  : () => Cesium.ImageryLayer.fromProviderAsync(Cesium.IonImageryProvider.fromAssetId(2)),       // Bing Maps Aerial
      streets : () => Cesium.ImageryLayer.fromProviderAsync(Cesium.IonImageryProvider.fromAssetId(3)),       // Bing Maps Road
      terrain : () => Cesium.ImageryLayer.fromProviderAsync(Cesium.IonImageryProvider.fromAssetId(3812)),    // Sentinel-2 (world imagery)
    };

    function setLayer(name) {
      if (!viewer) return;
      viewer.imageryLayers.removeAll();
      viewer.imageryLayers.add(LAYERS[name]());
      document.querySelectorAll('#layer-panel button').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + name).classList.add('active');
    }
  </script>
</body>
</html>
