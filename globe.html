<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 地球仪</title>

  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #06070d; }
    #map { width: 100%; height: 100%; }

    /* 图层切换面板 */
    #layer-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #layer-panel button {
      background: rgba(12, 14, 24, 0.88);
      color: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.18s, border-color 0.18s;
      letter-spacing: 0.3px;
      text-align: left;
    }

    #layer-panel button:hover {
      background: rgba(35, 82, 195, 0.52);
      border-color: rgba(90, 150, 255, 0.5);
    }

    #layer-panel button.active {
      background: rgba(30, 76, 200, 0.78);
      border-color: rgba(90, 150, 255, 0.9);
      color: #fff;
    }

    /* 操作提示 */
    #hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.42);
      font-size: 12px;
      letter-spacing: 0.8px;
      pointer-events: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: rgba(0, 0, 0, 0.32);
      padding: 5px 14px;
      border-radius: 20px;
    }

    /* 隐藏 MapLibre logo，保留 attribution 文字 */
    .maplibregl-ctrl-logo { display: none !important; }

    /* 导航按钮样式融入深色主题 */
    .maplibregl-ctrl-group {
      background: rgba(12, 14, 24, 0.88) !important;
      border: 1px solid rgba(255,255,255,0.12) !important;
      backdrop-filter: blur(8px);
    }
    .maplibregl-ctrl-group button {
      background-color: transparent !important;
    }
    .maplibregl-ctrl-group button span {
      filter: invert(1);
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="layer-panel">
    <button id="btn-street"    class="active" onclick="setLayer('street')"   >🗺 街道地图</button>
    <button id="btn-satellite"                onclick="setLayer('satellite')" >🛰 卫星图像</button>
    <button id="btn-topo"                     onclick="setLayer('topo')"      >🏔 地形图</button>
  </div>

  <div id="hint">拖拽旋转 &nbsp;·&nbsp; 滚轮缩放 &nbsp;·&nbsp; 双指旋转方向</div>

  <script>
    // ── 三种图层的内联 MapLibre 样式（不依赖外部 style.json，直接用 OSM / ESRI 瓦片） ──
    function buildStyle(sourceId, tiles, attribution) {
      return {
        version: 8,
        sources: {
          [sourceId]: {
            type: 'raster',
            tiles: tiles,
            tileSize: 256,
            attribution: attribution,
          }
        },
        layers: [{
          id: sourceId + '-layer',
          type: 'raster',
          source: sourceId,
          minzoom: 0,
          maxzoom: 20,
        }]
      };
    }

    const STYLES = {
      street: buildStyle(
        'osm',
        [
          'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
          'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
          'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png',
        ],
        '© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
      ),

      satellite: buildStyle(
        'esri-satellite',
        ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        'Tiles © <a href="https://www.esri.com" target="_blank">Esri</a>'
      ),

      topo: buildStyle(
        'esri-topo',
        ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}'],
        'Tiles © <a href="https://www.esri.com" target="_blank">Esri</a>'
      ),
    };

    // ── 初始化地图，3D 地球仪投影 ──
    const map = new maplibregl.Map({
      container: 'map',
      style: STYLES.street,
      center: [110, 28],
      zoom: 2,
      projection: 'globe',   // 3D 地球仪模式
      antialias: true,
      attributionControl: { compact: true },
    });

    // 地球大气层 + 星空效果
    map.on('style.load', () => {
      map.setFog({
        color           : 'rgb(180, 210, 240)',
        'high-color'    : 'rgb(30, 80, 200)',
        'horizon-blend' : 0.03,
        'space-color'   : 'rgb(6, 7, 20)',
        'star-intensity': 0.7,
      });
    });

    // 导航控件（缩放 + 指南针）
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');

    // ── 图层切换 ──
    let currentLayer = 'street';

    function setLayer(name) {
      if (name === currentLayer) return;
      currentLayer = name;

      // 更新按钮状态
      document.querySelectorAll('#layer-panel button').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + name).classList.add('active');

      // 切换样式，保留当前视角
      const { lng, lat } = map.getCenter();
      const zoom    = map.getZoom();
      const bearing = map.getBearing();
      const pitch   = map.getPitch();

      map.setStyle(STYLES[name]);

      // 样式加载完成后恢复大气层 + 视角
      map.once('style.load', () => {
        map.setFog({
          color           : 'rgb(180, 210, 240)',
          'high-color'    : 'rgb(30, 80, 200)',
          'horizon-blend' : 0.03,
          'space-color'   : 'rgb(6, 7, 20)',
          'star-intensity': 0.7,
        });
        map.jumpTo({ center: [lng, lat], zoom, bearing, pitch });
      });
    }
  </script>
</body>
</html>
